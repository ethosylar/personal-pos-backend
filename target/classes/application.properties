spring.application.name=personal-pos-backend

# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/personal_pos
spring.datasource.username=pos_app
spring.datasource.password=${POS_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info

# ============================================================
# JWT Security
# ============================================================

pos.security.jwt.secret=${POS_JWT_SECRET}
pos.security.jwt.issuer=personal-pos-backend
pos.security.jwt.access-token-ttl=PT30M

# ============================================================
# Initial Administrator Bootstrap
# ============================================================

pos.bootstrap.admin.enabled=${POS_BOOTSTRAP_ADMIN_ENABLED:false}
pos.bootstrap.admin.username=${POS_BOOTSTRAP_ADMIN_USERNAME:}
pos.bootstrap.admin.password=${POS_BOOTSTRAP_ADMIN_PASSWORD:}
pos.bootstrap.admin.full-name=${POS_BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}

# ============================================================
# Login Security
# ============================================================

pos.security.login.max-failed-attempts=5